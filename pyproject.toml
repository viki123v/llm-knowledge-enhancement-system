[project]
name = "llm-knowledge-enhancement"
version = "0.1.0"
description = "Recommendation system for course NLP at FINKI"
readme = "README.md"
authors = [
    { name = "viki123v", email = "viktorhristovski629@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "altair>=6.2.2",
    "dotenv>=0.9.9",
    "duckdb>=1.5.5",
    "duckdb-engine>=0.17.0",
    "faiss-cpu>=1.15.0",
    "ijson>=3.5.1",
    "jupysql>=0.11.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "openai>=3.1.0",
    "pandas>=3.0.5",
    "polars>=1.43.2",
    "psycopg2-binary>=2.9.11",
    "pyarrow>=25.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.7.0",
    "tenacity>=9.1.4",
]

[project.scripts]
main = "llm_knowledge_enhancement.__main__:main"
ingest-simple = "ingest.simple.__main__:main"

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "dvc-s3>=3.3.0",
    "prek>=0.3.9",
    "pytest>=8.4.2",
    "ruff>=0.15.11",
]

[tool.uv.build-backend]
module-name = ["llm_knowledge_enhancement", "ingest" ]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
extend-select = ["I"]
